// ============================================================================================
//  Sep 27 - replaces the blib-gradle plugin's 'blib-multiloader-common' (BlibMultiloaderCommonPlugin.java).
//  Each block below says which plugin method it came from. Behaviour is copied exactly, including
//  repository order, so the built jars should match the plugin's byte for byte apart from timestamps.
// ============================================================================================
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.diffplug.spotless'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
}

// exposeBlibProperties - group and version come from gradle.properties; the description came from the mod block.
description = mod_description

// configureBase
base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

// configureJava
java {
    withSourcesJar()
    withJavadocJar()
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

// inheritRootExtension (the root blib { maven { repository ... } } entries - added FIRST by the plugin), then
// configureRepositories. mavenLocal and avpReleases still come from the root build.gradle's allprojects block, which
// runs before this, exactly as before.
repositories {
    // Sep 27 - com.just (just-core, just-codec, just-goap) comes ONLY from BLib's local repository, one folder over at
    // ../blib/libs/just-maven. just-goap 0.4.1 is our own build and exists nowhere else; this mod declares the just
    // libraries directly (and bundles them on Fabric) AND gets them through BLib's POM, so both routes must find it
    // here. exclusiveContent stops Gradle asking any other repository for com.just - which is also why the old
    // maven.bvanseghi.dev/just line further down is gone. Requires the blib and avp_predator repos side by side.
    exclusiveContent {
        forRepository {
            maven {
                name = 'JustLocal'
                url = rootProject.file('../blib/libs/just-maven').toURI()
            }
        }
        filter { includeGroup('com.just') }
    }

    maven { url = 'https://maven.bvanseghi.dev/avp_alien' }
    maven { url = 'https://maven.bvanseghi.dev/avp_human' }
    maven { url = 'https://maven.bvanseghi.dev/blib_engine' }

    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    exclusiveContent {
        forRepositories(
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org/'
            },
            maven {
                name = 'NeoForge'
                url = 'https://maven.neoforged.net/releases'
            }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    // The plugin's BASE_MAVEN_URLS, in its order.
    maven { url = 'https://maven.bvanseghi.dev/blib' }
    maven { url = 'https://maven.azuredoom.com/mods' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.shedaniel.me' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://api.modrinth.com/maven' }
}

// configureCapabilities
['apiElements', 'runtimeElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

// configureJar
jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : project.jar.archiveVersion.get(),
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion.get(),
            'Implementation-Vendor' : mod_author,
            'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

// configureModuleMetadata
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

// configureIdea
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// configureMixinDependencies
dependencies {
    compileOnly "org.spongepowered:mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
}

// configureSlf4jResolution
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.slf4j' && details.requested.name == 'slf4j-api') {
            details.useVersion slf4j_version
            details.because 'Aligning SLF4J version to satisfy NeoForge strict constraint'
        }
        if (details.requested.group == 'ch.qos.logback' && details.requested.name == 'logback-classic') {
            details.useVersion logback_classic_version
            details.because 'Logback 1.5.x requires slf4j-api 2.0.17+, incompatible with NeoForge'
        }
    }
}

// configureRunAllDatagen - registered once, on the root project.
if (rootProject.tasks.findByName('runAllDatagen') == null) {
    rootProject.tasks.register('runAllDatagen') {
        description = 'Runs data generation for both NeoForge and Fabric (in that order).'
        dependsOn ':neoforge:runData', ':fabric:runDatagen'
    }

    gradle.projectsEvaluated {
        rootProject.project(':fabric').tasks.named('runDatagen').configure {
            mustRunAfter ':neoforge:runData'
        }
    }
}

// configureProcessResources - the plugin expanded every template with ALL project properties plus a computed
// blib_excl_end_version. Every placeholder the templates use is listed here; the map only has to be a superset.
static String blibExclusiveEndVersion(String version) {
    def parts = version.split('-')[0].split('\\.')
    return "${Integer.parseInt(parts[0])}.${Integer.parseInt(parts[1]) + 1}.0"
}

processResources {
    def expandProps = [
        'version'                      : version,
        'group'                        : project.group,
        'description'                  : project.description,
        'minecraft_version'            : minecraft_version,
        'minecraft_version_range'      : minecraft_version_range,
        'java_version'                 : java_version,
        'fabric_loader_version'        : fabric_loader_version,
        'fabric_version'               : fabric_version,
        'neoforge_version'             : neoforge_version,
        'neo_form_version'             : neo_form_version,
        'neoforge_loader_version_range': neoforge_loader_version_range,
        'parchment_minecraft'          : parchment_minecraft,
        'parchment_version'            : parchment_version,
        'mod_id'                       : mod_id,
        'mod_name'                     : mod_name,
        'mod_author'                   : mod_author,
        'mod_group'                    : project.group,
        'mod_version'                  : version,
        'mod_icon'                     : mod_icon,
        'mod_license'                  : mod_license,
        'mod_credits'                  : mod_credits,
        'mod_description'              : mod_description,
        'blib_version'                 : blib_version,
        'blib_excl_end_version'        : blibExclusiveEndVersion(blib_version),
        'avp_alien_version'            : avp_alien_version,
        'avp_alien_excl_end_version'   : avp_alien_excl_end_version,
        'avp_human_version'            : avp_human_version,
        'avp_human_excl_end_version'   : avp_human_excl_end_version,
        'just_codec_version'           : just_codec_version,
        'just_core_version'            : just_core_version,
        'just_goap_version'            : just_goap_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)

    // The plugin minified every JSON file in the processed resources.
    doLast {
        def startTime = System.currentTimeMillis()
        def minified = 0
        def bytesSaved = 0L

        fileTree(outputs.files.asPath) { include '**/*.json' }.each { File file ->
            minified++
            def originalLength = file.length()
            file.setText(JsonOutput.toJson(new JsonSlurper().parseText(file.getText('UTF-8'))), 'UTF-8')
            bytesSaved += originalLength - file.length()
        }

        logger.lifecycle('Minified {} json files. Saved {} bytes. Took {}ms.', minified, bytesSaved, System.currentTimeMillis() - startTime)
    }
}

// configurePublishing
publishing {
    repositories {
        maven {
            name = mod_id
            url = uri(maven_publish_url)

            credentials {
                username = System.getenv(maven_username_env)
                password = System.getenv(maven_password_env)
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    publications {
        maven(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java

            pom.withXml {
                def dependenciesNodes = asNode().get('dependencies')
                if (dependenciesNodes.isEmpty()) {
                    return
                }

                def iterator = dependenciesNodes.get(0).children().iterator()
                while (iterator.hasNext()) {
                    def dependency = iterator.next()
                    if (dependency.groupId.text() == 'com.terraformersmc' && dependency.artifactId.text() == 'modmenu') {
                        iterator.remove()
                    }
                }
            }
        }
    }
}

// configureSpotless - NOT hooked into build, exactly as under the plugin (run spotlessApply by hand).
spotless {
    enforceCheck false

    java {
        def formatterFile = rootProject.file('eclipse-formatter.xml')
        if (formatterFile.exists()) {
            eclipse().configFile(formatterFile)
        }
        endWithNewline()
        importOrder('', 'java', project.group.toString(), '\\#')
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}
