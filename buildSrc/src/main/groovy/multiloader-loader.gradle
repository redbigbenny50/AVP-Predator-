// Sep 27 - replaces the blib-gradle plugin's 'blib-multiloader-loader' (BlibMultiloaderLoaderPlugin.java): a loader
// module compiles common's SOURCES and packs common's RESOURCES into its own jar, and compiles against common with
// the capability the common module publishes.
plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Oct 23 - [stated] the jars should read "avp_alien-resurrection-..." (and the same for every avp mod), e.g.
// build/libs/avp_alien-resurrection-neoforge-1.21.1-0.2.8.jar
//
// Only the jar FILE NAMES change. base.archivesName is deliberately left alone, because it is load-bearing elsewhere:
// it is the Maven artifactId the sibling repos depend on (com.avp.alien:avp_alien-neoforge-1.21.1 and so on) and the
// capability the common module publishes, and both stay exactly as they were. The common module's own jar is not
// renamed either - it is a build-time library, never handed out. The mod-publish upload reads the jar task's own
// output, so it uploads the renamed file automatically.
//
// Covers every jar task in the loader modules: Fabric's remapJar (the finished jar), the plain jar, and the source jars.
// Change the word, per repo, with release_name_tag in gradle.properties.
def releaseNameTag = (project.findProperty('release_name_tag') ?: 'resurrection').toString()

// ⚠ org.gradle.jvm.tasks.Jar, NOT the script's default "Jar" (org.gradle.api.tasks.bundling.Jar). Fabric Loom's
// remapJar and remapSourcesJar extend org.gradle.jvm.tasks.Jar directly, so a plain withType(Jar) matched NeoForge's
// jar and Fabric's dev jar but skipped the finished Fabric jar - the Fabric file kept its old name. The jvm type is the
// parent of both, so this covers every jar task on both loaders.
tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
    archiveBaseName = "${mod_id}-${releaseNameTag}-${project.name}-${minecraft_version}"
}
