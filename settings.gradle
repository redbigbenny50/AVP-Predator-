// Sep 27 - converted from the blib-gradle plugin. The plugin's settings part added the foojay toolchain resolver and
// three content-filtered plugin repositories; both are written out here, and the blib-gradle included build is gone.
pluginManagement {
	repositories {
		mavenLocal()
		gradlePluginPortal()
		mavenCentral()
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = 'https://maven.fabricmc.net'
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
				includeGroup('fabric-loom')
			}
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'Sponge'
					url = 'https://repo.spongepowered.org/repository/maven-public'
				}
			}
			filter { includeGroupAndSubgroups('org.spongepowered') }
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'Forge'
					url = 'https://maven.minecraftforge.net'
				}
			}
			filter { includeGroupAndSubgroups('net.minecraftforge') }
		}
		maven { url = 'https://maven.neoforged.net/releases' }
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'AVP-Predator'
include 'common'
include 'fabric'
include 'neoforge'
