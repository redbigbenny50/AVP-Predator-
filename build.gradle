// Sep 27 - converted from the blib-gradle plugin. The blib { } block that used to live here is now plain properties in
// gradle.properties, and the build logic it drove lives in buildSrc (multiloader-common / multiloader-loader) and in
// each module's build.gradle. Everything else in this file is unchanged.

allprojects {
    repositories {
        mavenLocal()
        maven {
            name = "avpReleases"
            url = uri("https://maven.aliensvspredatormod.com/releases")
        }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.blib' && details.requested.name.startsWith('blib-')) {
                details.useVersion rootProject.blib_version
                details.because 'Some published AVP/BLib POMs point at missing BLib versions.'
            }
        }
    }
}

subprojects {
    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'blib_engine'
                    url = uri('https://maven.aliensvspredatormod.com/releases')

                    credentials {
                        username = System.getenv('MAVEN_USERNAME') ?: 'unused'
                        password = System.getenv('MAVEN_PASSWORD') ?: 'unused'
                    }
                }
            }
        }
    }
}
