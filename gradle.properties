# Done to increase the memory available to gradle.
org.gradle.jvmargs            = -Xmx4G
org.gradle.caching            = true
org.gradle.daemon             = true
org.gradle.parallel           = true

# ============================================================================================
#  Sep 27 - CONVERTED FROM THE blib-gradle PLUGIN TO buildSrc (like avp_alien, avp_human, blib).
#  Everything below "Mod" and "Ecosystem" used to be supplied by the plugin: the mod block came
#  from the root build.gradle's blib { mod { } } block, and the ecosystem versions were
#  hard-coded inside the plugin (BlibVersions.java). The values are copied exactly, so the
#  built jars should be identical to the plugin's.
# ============================================================================================

# Mod (was blib { mod { ... } } in the root build.gradle)
mod_id                        = avp_predator
mod_name                      = AVP (Predator)
mod_author                    = Stargazer Studios
mod_credits                   = Stargazer Studios
mod_description               = A module for the AVP universe that adds predator content.
mod_license                   = All Rights Reserved
mod_icon                      = assets/avp_predator/icon.png
group                         = com.avp.predator
version                       = 0.1.6z-fork

# Maven publishing (was blib { maven { publish { ... } } })
maven_publish_url             = https://maven.bvanseghi.dev/avp_predator/
maven_username_env            = AVP_MAVEN_USERNAME
maven_password_env            = AVP_MAVEN_PASSWORD

# CurseForge / Modrinth / Discord (was blib { mod { publish { ... } } })
# Only used when key.properties exists in the repo root, exactly as before.
publish_dry_run               = true
curseforge_project_id         = 1406353
curseforge_project_slug       = avp-predator
modrinth_project_id           = 3qzSv6RG
